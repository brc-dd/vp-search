name: Nightly

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions: {}

env:
  TZ: UTC
  LANG: en_US.UTF-8
  FORCE_COLOR: '1'

jobs:
  # Hunts inter-test coupling the PR lanes' stable order hides. Seed = run id (vitest never prints
  # its own) + matrix leg, for three orders a night.
  shuffle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm and node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: true

      # integrity needs dist built first.
      - name: Build packages
        run: pnpm build

      - name: Shuffled tests, no retries
        env:
          SEED: ${{ github.run_id }}${{ matrix.run }}
        run: >-
          pnpm vitest run
          -p shared -p client -p worker -p node -p integrity
          --sequence.shuffle --sequence.seed="$SEED"
          --detectAsyncLeaks

  # Live DocSearch schema-drift check (search-only key). Network-dependent — nightly only, never
  # gates PRs (DESIGN §13).
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm and node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: true

      - name: Algolia schema-drift contract
        run: pnpm test:live
