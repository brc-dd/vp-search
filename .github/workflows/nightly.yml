name: Nightly

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions: {}

env:
  TZ: UTC
  LANG: en_US.UTF-8
  FORCE_COLOR: '1'

jobs:
  # Order-dependence hunt: the PR lanes run with vitest's stable order, so
  # inter-test coupling only surfaces here. Seeded from the run id because
  # vitest never prints the seed it picks on its own; three legs give three
  # orders per night.
  shuffle:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm and node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: true

      # The integrity project validates dist, so build first.
      - name: Build packages
        run: pnpm build

      - name: Shuffled tests, no retries
        env:
          SEED: ${{ github.run_id }}${{ matrix.run }}
        run: >-
          pnpm vitest run
          -p shared -p client -p worker -p node -p integrity
          --sequence.shuffle --sequence.seed="$SEED"
          --detectAsyncLeaks

  # Schema-drift contract against the public DocSearch index (search-only key).
  # Network-dependent by design, so it lives here and never gates PRs.
  live:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm and node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: true

      - name: Algolia schema-drift contract
        env:
          VP_SEARCH_LIVE: '1'
        run: pnpm vitest run -p live
