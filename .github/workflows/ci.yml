name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # test.env only reaches vitest workers; globalSetup/vitepress builds need it set here too (DESIGN
  # §13, Determinism).
  TZ: UTC
  LANG: en_US.UTF-8
  FORCE_COLOR: '1'
  # Skips the ~15-20s lockfile re-verification (minimumReleaseAge/trustPolicy); the check job below
  # re-enables it, so it still runs once per run.
  PNPM_CONFIG_TRUST_LOCKFILE: 'true'

jobs:
  # Compile + publish-shape validation. Owns the lockfile verification.
  check:
    # Pinned to 24.04 everywhere: the 26.04-preview image caused e2e crashes and was fully reverted
    # — re-probe at GA (DESIGN §13).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PNPM_CONFIG_TRUST_LOCKFILE: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm and node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: true

      - name: Check formatting
        run: pnpm format:check

      # Build before typecheck: vue-tsc -p test checks the integrity suite against the real dist
      # .d.ts, doubling as emitted-declaration validation.
      - name: Build packages
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Build example site
        run: pnpm docs:build

      - name: Integrity tests
        run: pnpm test:integrity

  # Hermetic, build-free lane — goes red fastest.
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm and node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: true

      - name: Unit tests
        run: pnpm test:unit

  # Fixture site; dev + built output both run — the paths genuinely diverge (DESIGN §13).
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: dev
            script: test:e2e
          - mode: build
            script: test:e2e:build
    name: e2e (${{ matrix.mode }})
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm and node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: true

      # --only-shell suffices: vitest/playwright drive it by default. Uncached — restore ≈ download
      # time for one browser in one job (DESIGN §13).
      - name: Install Chromium headless shell
        run: pnpm --filter vp-search-e2e exec playwright-core install chromium --only-shell

      - name: E2E tests
        env:
          SCRIPT: ${{ matrix.script }}
        run: pnpm run "$SCRIPT"

  lint-workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # zizmor uploads SARIF to code scanning
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        # kjanat/actionlint fork, not raven-actions: its label DB predates the ubuntu-26.04 label.
        # Switch back when upstream catches up (DESIGN §13).
        uses: kjanat/actionlint@7c5b0a3880b3d29c51072b1e5e0730e5988f8b7d # v1.12.0

      - name: zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
