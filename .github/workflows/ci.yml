name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Deterministic clock and locale for every process, including vitest's
  # globalSetup and the vitepress builds — test.env only reaches test workers.
  TZ: UTC
  LANG: en_US.UTF-8
  FORCE_COLOR: '1'
  # minimumReleaseAge/trustPolicy re-verification of the whole lockfile costs
  # ~15-20s per install; the check job below opts back in so it still happens
  # exactly once per run.
  PNPM_CONFIG_TRUST_LOCKFILE: 'true'

jobs:
  # Compile + publish-shape validation. Owns the lockfile verification.
  check:
    # ubuntu-26.04 probe: playwright-core 1.62 officially supports it; the image
    # is still GitHub-preview (no SLA) — evaluating ahead of the -latest repoint.
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PNPM_CONFIG_TRUST_LOCKFILE: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm and node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: true

      - name: Check formatting
        run: pnpm format:check

      # Build precedes typecheck: vue-tsc -p test checks the integrity suite
      # against the real dist .d.ts, which doubles as validation of the emitted
      # declarations.
      - name: Build packages
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Build example site
        run: pnpm docs:build

      - name: Integrity tests
        run: pnpm test:integrity

  # Fast hermetic lane: no build, no browser. Reddest fastest.
  unit:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm and node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: true

      - name: Unit tests
        run: pnpm test:unit

  # Real browser over the dedicated fixture site, dev and built output — the
  # two paths genuinely diverge (inlined dev locales vs fetched artifacts).
  e2e:
    # e2e stays on 24.04: three dev-mode renderer-crash episodes on the 26.04
    # preview image (zero ever on 24.04) — re-probe when it GAs.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: dev
            script: test:e2e
          - mode: build
            script: test:e2e:build
    name: e2e (${{ matrix.mode }})
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm and node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: true

      # ~77MB headless shell; vitest/playwright drive it by default, no full
      # Chromium needed. Not cached: restore time ≈ download time at one
      # browser in one job (playwright's own CI guidance).
      - name: Install Chromium headless shell
        run: pnpm --filter vp-search-e2e exec playwright-core install chromium --only-shell

      - name: E2E tests
        env:
          SCRIPT: ${{ matrix.script }}
        run: pnpm run "$SCRIPT"

  lint-workflows:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      # zizmor uploads SARIF to code scanning
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        # temporarily the actively-released rhysd/actionlint fork:
        # raven-actions bundles a linter whose runner-label DB predates the
        # ubuntu-26.04 preview label; switch back when upstream catches up
        uses: kjanat/actionlint@7c5b0a3880b3d29c51072b1e5e0730e5988f8b7d # v1.12.0

      - name: zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
