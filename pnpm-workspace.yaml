packages:
  - 'packages/*'
  - 'examples/*'
  - 'test/e2e'

minimumReleaseAge: 1440
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 525600
blockExoticSubdeps: true

strictDepBuilds: true
strictPeerDependencies: true
verifyDepsBeforeRun: install

update:
  githubActions: true

overrides:
  esbuild: '-'
  rolldown: latest

patchedDependencies:
  vue-sfc-transformer: patches/vue-sfc-transformer.patch
# auto-added by pnpm: 20.11.6 was ~21h old at install time. Drop the entry (and
# re-resolve) once it clears the 1440-minute gate on its own.
minimumReleaseAgeExclude:
  - happy-dom@20.11.6
